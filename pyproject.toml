[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telephony-gender-bench"
version = "0.2.0"
description = "Benchmark and combine speaker gender models on narrowband (8 kHz) call audio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Humayun Talal", email = "humayun.talal@gmail.com"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
models = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["tgb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
